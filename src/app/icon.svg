<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <title>Worldsmith</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
    <!-- Knock the mark out of the badge so the near-black shows through: far punchier at
         16px than a thin transparent ring, which disappears in a tab strip. -->
    <mask id="knock">
      <rect width="100" height="100" fill="#fff"/>
      <g transform="translate(13.54 16.71) scale(0.714)">
        <path d="M85.95 32.47 A40 40 0 1 1 63.68 12.41 L61.23 23.54 A25 25 0 1 0 75.15 36.07 Z" fill="#000"/>
        <path d="M92.12 3.21 L89.82 13.25 L80.08 16.59 L82.38 6.55 Z" fill="#000"/>
      </g>
    </mask>
  </defs>
  <rect width="100" height="100" rx="22" fill="#0a0a0a"/>
  <rect width="100" height="100" rx="22" fill="url(#bg)" mask="url(#knock)"/>
</svg>
